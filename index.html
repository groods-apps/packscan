<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="gRoods Lager">
<link rel="apple-touch-icon" href="packscan-192.png">
<link rel="icon" type="image/png" href="packscan-192.png">
<title>gRoods Lager</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1b1f24;--muted:#6b7280;--line:#e3e5e8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--fg:#e8eaed;--muted:#9aa0a6;--line:#2a2e35}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:24px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 20px}
a.app{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none}
a.app img{width:64px;height:64px;border-radius:14px;flex:none}
a.app b{font-size:19px;display:block}
a.app span{color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>gRoods Lager</h1>
  <p>Welche App möchtest du öffnen?</p>
  <a class="app" href="packscan.html"><img src="packscan-192.png" alt=""><div><b>PackScan</b><span>Pickliste, Einpacken per Label-Scan, Versand abschließen</span></div></a>
  <a class="app" href="inventur.html"><img src="inventur-192.png" alt=""><div><b>Inventur</b><span>Artikel scannen, Lagerplatz und Bestand je Lager pflegen</span></div></a>
  <div class="hint">Tipp: Öffne eine App und lege sie über Teilen → „Zum Home-Bildschirm“ ab – dann startet sie direkt.</div>
</main>
</body>
</html>
